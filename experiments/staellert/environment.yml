name: zikry_lab-staellert
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.26
  - pandas>=2.1
  - matplotlib>=3.8
  - scikit-learn>=1.4
  - joblib>=1.3        # bundled with scikit-learn; explicit pin for parallel safety
  - ipython>=8.0        # used by analysis/top40_feature_comparison_results_analysis.ipynb
  - ipykernel>=6.0
  - pip

# Covers: run_staellert_top40_comparison.py and
# analysis/top40_feature_comparison_results_analysis.ipynb.
# The script imports the shared `rid` package from the repo root at runtime
# via a sys.path insert (see the top of the script) rather than an installed
# package, so `rid` is not listed here as a dependency.
# seaborn is intentionally omitted: the analysis notebook only uses
# matplotlib.pyplot directly.
# data/staellert_et_al/control_manifold_scvr_compatible.h5ad is not read by
# any current script or notebook, so anndata/scanpy are not listed; add them
# if you start using that file.
