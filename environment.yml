# Shared umbrella environment covering all three experiments combined
# (falcon_cano, staellert, nonlinear_interaction_simulation) plus every
# analysis notebook in the repo. Use this for a single env that can run
# everything; use experiments/<name>/environment.yml for a minimal env
# scoped to just one experiment.
name: zikry_lab
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.26
  - pandas>=2.1
  - matplotlib>=3.8
  - seaborn>=0.13
  - scikit-learn>=1.4
  - ipython>=8.0
  - ipykernel>=6.0
  - joblib>=1.3        # bundled with scikit-learn; explicit pin for parallel safety
  - pip
